name: Build Fabric Mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Check Java versions
        run: |
          java -version
          javac -version

      - name: Check pixel models and textures
        run: python3 tools/check_pixel_import.py

      - name: Check hair motion
        run: |
          mkdir -p build/motion-check
          javac -d build/motion-check src/client/java/cn/deepmod/bigfatfish/client/FishMotion.java src/client/java/cn/deepmod/bigfatfish/client/FishHairBend.java tools/FishMotionCheck.java tools/FishHairBendCheck.java
          java -cp build/motion-check cn.deepmod.bigfatfish.client.FishMotionCheck
          java -cp build/motion-check cn.deepmod.bigfatfish.client.FishHairBendCheck

      - name: Build and run server GameTests
        run: bash ./gradlew --no-daemon build runGametest

      - name: Upload mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: bigfatfish-mc26.3-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gametest-report
          path: build/gametest-results.xml
          if-no-files-found: ignore

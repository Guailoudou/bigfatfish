plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
loom {
    splitEnvironmentSourceSets()
    mods { bigfatfish { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs {
        gametest {
            server()
            name 'Big Fat Fish Game Tests'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
        clienttest {
            client()
            name 'Big Fat Fish Client Test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=bigfatfish'
            runDir 'build/clienttest'
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

tasks.register('cleanupClientTestWorlds') {
    doLast {
        def runDirectory = layout.buildDirectory.dir('clienttest').get().asFile.canonicalFile
        def saves = new File(runDirectory, 'saves').canonicalFile
        def manifest = new File(runDirectory, 'worlds-to-delete.txt')
        if (!manifest.exists()) return
        manifest.readLines('UTF-8').findAll { !it.isBlank() }.unique().each { name ->
            def save = new File(saves, name).canonicalFile
            if (save.parentFile != saves) throw new GradleException("Refusing to delete outside client test saves: ${save}")
            project.delete(save)
            if (save.exists()) throw new GradleException("Cannot delete closed client test world: ${save}")
            logger.lifecycle("Removed closed client test world: ${name}")
        }
        if (!manifest.delete()) throw new GradleException('Cannot remove client test cleanup manifest')
    }
}
tasks.named('runClienttest') { finalizedBy('cleanupClientTestWorlds') }

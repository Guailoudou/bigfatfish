plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
loom {
    splitEnvironmentSourceSets()
    mods { bigfatfish { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs {
        gametest {
            server()
            name 'Big Fat Fish Game Tests'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
        clienttest {
            client()
            name 'Big Fat Fish Client Test'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=bigfatfish'
            runDir 'build/clienttest'
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
